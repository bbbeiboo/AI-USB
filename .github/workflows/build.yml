name: Build & Release

# 三平台矩阵构建：Windows / macOS / Linux
# 触发：
#   - push 标签 v*（自动构建并发布 GitHub Release）
#   - 手动 workflow_dispatch（仅构建 + 上传 artifact）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: npm run dist:win
            artifact: |
              release/*.exe
              release/*.blockmap
          - name: macos
            os: macos-latest
            script: npm run dist:mac
            artifact: |
              release/*.dmg
              release/*.zip
          - name: linux
            os: ubuntu-latest
            script: npm run dist:linux
            artifact: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # deb 打包需要 fpm（ruby gem）
      - name: Install fpm (Linux, for deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm --no-document

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # CI runner 上 tasklist/taskkill 偶尔有延迟，给测试更多余量
          CI: 'true'

      - name: Build
        run: ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置证书时跳过 macOS 代码签名（生产发布应注入 CSC_LINK/CSC_KEY_PASSWORD）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-usb-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
